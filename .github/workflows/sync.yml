name: Refresh public intelligence
on:
  workflow_dispatch:
    inputs:
      dispatch_kind:
        description: Dispatch provenance for owner verification
        type: choice
        options: [manual, cloudflare-cron]
        default: manual
      scheduled_at:
        description: Cloudflare scheduler UTC timestamp, empty for manual runs
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: public-feed-writer
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: public-feeds
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python feed.py
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_D1_DATABASE_ID: ${{ secrets.PUBLIC_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          FEED_DISPATCH_KIND: ${{ inputs.dispatch_kind }}
          FEED_SCHEDULED_AT: ${{ inputs.scheduled_at }}
